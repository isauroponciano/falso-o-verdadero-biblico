<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verdadero o Falso — Oración y Sanidad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--muted:#64748b}body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#fbfbff,#f8fafc);color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{width:100%;max-width:980px;background:#fff;border-radius:18px;padding:22px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(2,6,23,0.08)}
.top-right{position:absolute;right:16px;top:16px;display:flex;gap:8px;align-items:center}
.btn{padding:10px 14px;border-radius:10px;border:1px solid #e6e9ef;background:white;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 360px;gap:18px}
.card{padding:16px;border-radius:12px;border:1px solid #eef2ff;background:#fff}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay .panel{background:rgba(255,255,255,0.95);padding:18px;border-radius:12px;border:1px solid #e8eefc;font-weight:700}
.pause-btn{padding:10px 14px;border-radius:999px;border:1px solid #e6e9ef;background:#fff;cursor:pointer;font-weight:700}
.hidden{display:none}
</style></head><body>
<div class="container" id="app">
  <div class="top-right"><button id="soundToggle" class="btn">🔊</button><button id="pauseBtn" class="pause-btn">⏸️ Pausar</button></div>
  <h1>Verdadero o Falso — Oración y Sanidad</h1>
  <div id="startScreen"><div>“Orad sin cesar.” — 1 Tesalonicenses 5:17</div>
    <div style="margin-top:12px"><input id="p1" placeholder="Jugador 1" value="Jugador 1"> <input id="p2" placeholder="Jugador 2" value="Jugador 2"></div>
    <div style="margin-top:12px"><button id="startBtn" class="btn">Iniciar juego</button> <label><input id="autoFullscreen" type="checkbox" checked> Iniciar en pantalla completa</label></div>
  </div>
  <div id="gameScreen" class="hidden">
    <div class="grid">
      <div><div class="card" id="gameCard"><div><div id="qIndex">Pregunta</div><div id="qDiff">Dificultad</div></div><h2 id="qText"></h2>
      <div><button id="trueBtn" class="btn">Verdadero</button> <button id="falseBtn" class="btn">Falso</button></div>
      <div style="margin-top:8px">Tiempo: <span id="timer">15s</span></div>
      <div id="answerBox" class="hidden"><div id="answerText"></div><div id="verseText"></div></div></div></div>
      <aside><div class="card"><div id="p1Name">Jugador 1 <span id="p1Score">0</span></div><div id="p2Name">Jugador 2 <span id="p2Score">0</span></div>
      <div style="margin-top:8px"><button id="endNow" class="btn">Terminar ahora</button><button id="reshuffle" class="btn">Barajar preguntas</button></div></div>
      <div class="card" style="margin-top:12px"><div>Últimas rondas</div><div id="history"></div></div></aside>
    </div>
  </div>
  <div id="resultScreen" class="hidden"><div class="card"><h2>Juego terminado</h2><div id="res1Name"></div><div id="res2Name"></div><div id="winnerText"></div><div><button id="playAgain" class="btn">Jugar otra vez</button><button id="backHome" class="btn">Volver al inicio</button></div></div></div>
  <div class="overlay" id="pauseOverlay"><div class="panel">⏸️ Juego en pausa</div></div>
  <div style="margin-top:12px;font-size:12px;color:#64748b">Hecho con ❤️ — Desarrollado por Isauro Vlad</div>
</div>
<canvas id="confetti-canvas" style="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none"></canvas>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const QUESTIONS = [{"id": 1, "text": "La oración puede transformar situaciones imposibles.", "answer": true, "difficulty": "difícil", "verse": "Marcos 11:24"}, {"id": 2, "text": "La sanidad espiritual nunca requiere intervención médica.", "answer": false, "difficulty": "difícil", "verse": "Lucas 5:31"}, {"id": 3, "text": "Orar en comunidad fortalece la fe de los participantes.", "answer": true, "difficulty": "medio", "verse": "Mateo 18:19-20"}, {"id": 4, "text": "La Biblia prohíbe pedir sanidad por otros mediante la oración.", "answer": false, "difficulty": "medio", "verse": "Santiago 5:14-15"}, {"id": 5, "text": "Una actitud persistente en la oración es presentada como algo positivo en la Biblia.", "answer": true, "difficulty": "fácil", "verse": "Lucas 18:1"}, {"id": 6, "text": "La sanidad siempre ocurre inmediatamente después de orar.", "answer": false, "difficulty": "medio", "verse": "2 Corintios 12:8-9"}, {"id": 7, "text": "Pedir perdón y reconciliación puede acompañar procesos de sanidad.", "answer": true, "difficulty": "medio", "verse": "Santiago 5:16"}, {"id": 8, "text": "Sólo líderes religiosos pueden interceder por la sanidad de otros.", "answer": false, "difficulty": "difícil", "verse": "1 Timoteo 2:1"}, {"id": 9, "text": "La fe personal no tiene relación con la sanidad emocional y espiritual.", "answer": false, "difficulty": "difícil", "verse": "Marcos 5:34"}, {"id": 10, "text": "Existen ejemplos bíblicos de sanidad que se dan por medio de la oración y la imposición de manos.", "answer": true, "difficulty": "medio", "verse": "Marcos 16:18"}, {"id": 11, "text": "La oración no cambia cómo nos sentimos, pero sí cambia cómo vemos las circunstancias.", "answer": true, "difficulty": "fácil", "verse": "Filipenses 4:6-7"}, {"id": 12, "text": "La sanidad integral puede incluir dimensiones física, emocional y espiritual.", "answer": true, "difficulty": "fácil", "verse": "3 Juan 1:2"}, {"id": 13, "text": "Jesús realizó sanidades como señal del amor y poder de Dios.", "answer": true, "difficulty": "fácil", "verse": "Mateo 9:35"}, {"id": 14, "text": "El libro de Santiago menciona la oración de fe para sanar a los enfermos.", "answer": true, "difficulty": "medio", "verse": "Santiago 5:15"}, {"id": 15, "text": "Orar con fe significa que siempre obtendremos lo que pedimos.", "answer": false, "difficulty": "difícil", "verse": "1 Juan 5:14"}, {"id": 16, "text": "El ayuno puede acompañar la oración en momentos de búsqueda espiritual.", "answer": true, "difficulty": "medio", "verse": "Mateo 6:17-18"}, {"id": 17, "text": "El Espíritu Santo no interviene en la sanidad del creyente.", "answer": false, "difficulty": "difícil", "verse": "Romanos 8:11"}, {"id": 18, "text": "En la Biblia, Jesús sanó tanto el cuerpo como el alma de las personas.", "answer": true, "difficulty": "medio", "verse": "Mateo 9:2"}, {"id": 19, "text": "Orar con gratitud fortalece la esperanza y la paz interior.", "answer": true, "difficulty": "fácil", "verse": "Colosenses 4:2"}, {"id": 20, "text": "La oración solo debe hacerse cuando estamos enfermos.", "answer": false, "difficulty": "fácil", "verse": "1 Tesalonicenses 5:17"}, {"id": 21, "text": "El poder de la oración depende de la cantidad de palabras utilizadas.", "answer": false, "difficulty": "fácil", "verse": "Mateo 6:7"}, {"id": 22, "text": "En los Evangelios, muchas sanidades fueron precedidas por actos de fe.", "answer": true, "difficulty": "medio", "verse": "Lucas 8:48"}, {"id": 23, "text": "La oración intercesora busca el bien de los demás.", "answer": true, "difficulty": "fácil", "verse": "Job 42:10"}, {"id": 24, "text": "La falta de respuesta inmediata a una oración significa que Dios no escucha.", "answer": false, "difficulty": "difícil", "verse": "Salmos 37:7"}, {"id": 25, "text": "El agradecimiento después de la sanidad es una expresión de fe.", "answer": true, "difficulty": "fácil", "verse": "Lucas 17:15-16"}];
let questionList=[]; let index=0; let timer=15; let timerId=null; let currentPlayer=0; let scores=[0,0]; let history=[]; let showAnswer=false; let paused=false;
const ding = new Audio('sounds/ding.mp3'); const buzz = new Audio('sounds/buzz.mp3'); const pauseSnd = new Audio('sounds/pause.mp3'); const resumeSnd = new Audio('sounds/resume.mp3'); const swipe = new Audio('sounds/swipe.mp3');
const soundToggle = document.getElementById('soundToggle'); const pauseBtn = document.getElementById('pauseBtn');
let soundOn = localStorage.getItem('vf_sound_on')===null?true:localStorage.getItem('vf_sound_on')==='1'; updateSoundUI();
soundToggle.addEventListener('click', ()=>{ soundOn = !soundOn; updateSoundUI(); });
function updateSoundUI(){ soundToggle.textContent = soundOn ? '🔊' : '🔇'; localStorage.setItem('vf_sound_on', soundOn ? '1' : '0'); }
function play(a){ if(!soundOn) return; try{ a.currentTime=0; a.play(); }catch(e){} }
function confettiCelebrate(){ confetti.create(document.getElementById('confetti-canvas'), {resize:true})({particleCount:120,spread:80,origin:{y:0.6}}); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]] } return b; }
function startGame(autoFull=true){ questionList = shuffle(QUESTIONS); index=0; scores=[0,0]; history=[]; currentPlayer=0; document.getElementById('p1Name').textContent = document.getElementById('p1').value||'Jugador 1'; document.getElementById('p2Name').textContent = document.getElementById('p2').value||'Jugador 2'; document.getElementById('p1Score').textContent='0'; document.getElementById('p2Score').textContent='0'; document.getElementById('history').innerHTML=''; showScreen('game'); if(soundOn) play(swipe); if(autoFull && document.getElementById('autoFullscreen').checked) requestFullscreen(); loadQuestion(); }
function requestFullscreen(){ const el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen().catch(()=>{}); }
document.getElementById('startBtn').addEventListener('click', ()=>startGame(true)); document.getElementById('endNow').addEventListener('click', ()=>endGame()); document.getElementById('reshuffle').addEventListener('click', ()=>{ questionList=shuffle(questionList); index=0; loadQuestion(); if(soundOn) play(swipe); });
document.getElementById('trueBtn').addEventListener('click', ()=>answer(true)); document.getElementById('falseBtn').addEventListener('click', ()=>answer(false)); document.getElementById('playAgain').addEventListener('click', ()=>startGame(false)); document.getElementById('backHome').addEventListener('click', ()=>showScreen('start'));
pauseBtn.addEventListener('click', ()=>{ if(!paused) doPause(); else doResume(); });
function loadQuestion(){ if(paused) return; clearInterval(timerId); timer=15; document.getElementById('timer').textContent = timer + 's'; const q = questionList[index]; document.getElementById('qIndex').textContent = `Pregunta ${index+1} / ${questionList.length}`; document.getElementById('qDiff').textContent = `Dificultad: ${q.difficulty}`; document.getElementById('qText').textContent = q.text; document.getElementById('answerBox').classList.add('hidden'); enableButtons(true); startTimer(); }
function startTimer(){ timerId = setInterval(()=>{ if(paused) return; timer--; document.getElementById('timer').textContent = timer + 's'; if(timer<=0){ clearInterval(timerId); timeout(); } },1000); }
function enableButtons(v){ document.getElementById('trueBtn').disabled = !v; document.getElementById('falseBtn').disabled = !v; }
function getPoints(d){ if(d==='fácil') return 10; if(d==='medio') return 20; return 30; }
function answer(choice){ if(showAnswer||paused) return; const q=questionList[index]; const correct = q.answer===choice; const pts = correct? getPoints(q.difficulty):0; scores[currentPlayer]+=pts; document.getElementById(currentPlayer===0?'p1Score':'p2Score').textContent = scores[currentPlayer]; const record={qid:q.id,text:q.text,player:(currentPlayer===0?document.getElementById('p1').value:document.getElementById('p2').value),choice,correct,points:pts,difficulty:q.difficulty,verse:q.verse}; history.unshift(record); renderHistory(); showAnswerBox(correct,q.verse,pts); clearInterval(timerId); if(correct){ play(ding); confettiCelebrate(); } else { play(buzz); } showAnswer=true; enableButtons(false); setTimeout(()=>{ showAnswer=false; const nextPlayer=(currentPlayer+1)%2; if(nextPlayer===0){ index++; if(index>=questionList.length){ endGame(); return; } } currentPlayer = nextPlayer; loadQuestion(); if(soundOn) play(swipe); },1400); }
function timeout(){ if(paused) return; const q=questionList[index]; const record={qid:q.id,text:q.text,player:(currentPlayer===0?document.getElementById('p1').value:document.getElementById('p2').value),choice:null,correct:false,points:0,difficulty:q.difficulty,timedOut:true,verse:q.verse}; history.unshift(record); renderHistory(); showAnswerBox(false,q.verse,0,true); play(buzz); showAnswer=true; enableButtons(false); setTimeout(()=>{ showAnswer=false; const nextPlayer=(currentPlayer+1)%2; if(nextPlayer===0){ index++; if(index>=questionList.length){ endGame(); return; } } currentPlayer = nextPlayer; loadQuestion(); if(soundOn) play(swipe); },1400); }
function doPause(){ paused=true; clearInterval(timerId); document.getElementById('pauseOverlay').classList.add('show'); pauseBtn.textContent='▶️ Reanudar'; enableButtons(false); play(pauseSnd); }
function doResume(){ paused=false; document.getElementById('pauseOverlay').classList.remove('show'); pauseBtn.textContent='⏸️ Pausar'; play(resumeSnd); loadQuestion(); if(soundOn) play(swipe); }
function showAnswerBox(correct,verse,pts,timedOut=false){ const box=document.getElementById('answerBox'); document.getElementById('answerText').textContent = timedOut ? 'Tiempo agotado' : (correct? '✅ Respuesta correcta' : '❌ Respuesta correcta'); document.getElementById('verseText').textContent = '📖 ' + verse + (pts? (' • +' + pts + ' pts') : ''); box.classList.remove('hidden'); }
function renderHistory(){ const el=document.getElementById('history'); el.innerHTML=''; history.slice(0,50).forEach(h=>{ const d=document.createElement('div'); d.style.padding='8px'; d.style.borderRadius='8px'; d.style.background='#fbfdff'; d.style.marginBottom='8px'; d.style.display='flex'; d.style.justifyContent='space-between'; d.style.alignItems='center'; d.innerHTML = `<div style="max-width:70%"><strong style="font-size:13px">${h.player}</strong>: <span style="font-size:13px;color:#374151">${h.text}</span></div><div style="font-weight:700;color:${h.correct?"#16a34a":"#ef4444"}">${h.points}</div>`; el.appendChild(d); }); }
function endGame(){ clearInterval(timerId); showScreen('result'); document.getElementById('res1Name').textContent = document.getElementById('p1').value||'Jugador 1'; document.getElementById('res2Name').textContent = document.getElementById('p2').value||'Jugador 2'; document.getElementById('res1Score').textContent = scores[0]; document.getElementById('res2Score').textContent = scores[1]; const winnerEl=document.getElementById('winnerText'); if(scores[0]===scores[1]){ winnerEl.textContent='Empate'; } else { const w = scores[0]>scores[1]? document.getElementById('res1Name').textContent : document.getElementById('res2Name').textContent; winnerEl.textContent = '¡Ganador: '+w+'!'; confettiCelebrate(); } }
function showScreen(which){ document.getElementById('startScreen').classList.toggle('hidden', which!=='start'); document.getElementById('gameScreen').classList.toggle('hidden', which!=='game'); document.getElementById('resultScreen').classList.toggle('hidden', which!=='result'); }
showScreen('start');
</script></body></html>
